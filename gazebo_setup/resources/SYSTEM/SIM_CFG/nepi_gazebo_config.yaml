# Control
# Set by the DEVICE (1 to request the action) and cleared back to 0 by
# the SERVICE once it has carried out the action -- same convention
# nepi_docker.sh uses for its own request flags: do the work (reflected
# via GAZEBO_STATE while in flight), then zero the flag once the outcome
# is known. Not left for the device to clear, so a later unrelated
# request that bumps GAZEBO_LAST_UPDATED can't find a stale 1 here and
# re-trigger the same action again. The device only needs to flip
# 0 -> 1 (and bump GAZEBO_LAST_UPDATED) to issue a new request; watch
# GAZEBO_STATE for the outcome. If GAZEBO_START and GAZEBO_STOP are both
# 1 at once (e.g. the device fired both before the service cleared the
# first), GAZEBO_STOP wins.
# 1 = start requested.
GAZEBO_START: 0
# 1 = stop requested. Takes priority over GAZEBO_START if both are set.
GAZEBO_STOP: 0
# 1 = also run install_command before starting (or on its own, with
# start left at 0, to just pre-install without launching). Same
# clear-on-act convention as GAZEBO_START/GAZEBO_STOP above.
GAZEBO_INSTALL: 0
# Unix epoch seconds, set by the device on every write to this section.
# The service's own "is this a new request" check should be
# last_updated > whatever it last acted on, not a content diff.
GAZEBO_LAST_UPDATED: 0
# Written by the VM-SIDE SERVICE. The device only ever READS this section
# (the same role status_<request_id>.json plays in the per-request-file
# protocol).
# Status
# idle | installing | starting | running | stopping | failed
GAZEBO_STATE: "idle"
# Empty when there is none.
GAZEBO_LAST_ERROR: ""
# PID of the running launch process, once state == "running" -- null/0
# otherwise. Lets the device show something concrete, not just "running".
GAZEBO_PID: 0
# Unix epoch seconds, updated by the service on every poll tick
# regardless of whether anything changed -- the device's equivalent of an
# SSH reachability probe or vm_command_watcher.py's own
# watcher_heartbeat.json: if this goes stale (much older than the
# service's poll interval), the device should treat this VM-side service
# as unreachable rather than trusting whatever GAZEBO_STATE last said.
GAZEBO_LAST_POLL: 0
